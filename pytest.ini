[pytest]
# Make the repository root importable so `import app` resolves when pytest is
# invoked as the bare `pytest` console script. Unlike `python -m pytest`, that
# script does not put the current directory on sys.path, which is why CI
# (`pytest tests/ -v`) failed with "No module named 'app'" while a local
# `python -m pytest` succeeded.
pythonpath = .

# `pytest` with no arguments runs the suite, matching the command in the README.
testpaths = tests
