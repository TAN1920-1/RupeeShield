name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The generator is seeded, so CI regenerates the same data every run. `--sample`
      # caps it at 300 accounts / 12k transactions to keep the job quick.
      - name: Generate synthetic dataset (small sample)
        run: python scripts/generate_dataset.py --sample

      - name: Train detection models
        run: python -m app.ml.train

      - name: Run tests
        run: pytest tests/ -v

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and unit tests
        run: npm test

      - name: Production build
        run: npm run build
